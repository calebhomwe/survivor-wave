name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The repo root also holds debug screenshots (*.png) and probe scripts
      # (*_probe.py, combat_test.py, ...). Stage only what a player needs so
      # those internals never reach the public URL.
      - name: Stage publishable files
        run: |
          mkdir -p _site
          cp index.html survivor-wave.html _site/
          if [ -d assets ]; then cp -r assets _site/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
